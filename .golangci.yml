version: "2"

linters:
  enable:
    - gocritic
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
  exclusions:
    paths:
      - frontend/node_modules

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - wt

run:
  timeout: 5m
