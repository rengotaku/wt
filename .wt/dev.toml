# wt の dev サーバー定義。`wt serve` / Web の「起動」ボタンで使われる。
# 各 service には割当ブロックの base+i が割り当てられ、コマンド内の ${port} に
# 置換される。全 service のポートは WT_PORT_<NAME> env で共有される
# （フロントは WT_PORT_API を見て API へプロキシする。vite.config.ts 参照）。

[[services]]
name = "api"
cmd = "go run -tags dev . web -p ${port}"

[[services]]
name = "web"
cmd = "cd frontend && npm run dev -- --port ${port} --strictPort"
domain = true
